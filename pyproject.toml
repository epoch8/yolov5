# Overview:
# This pyproject.toml file manages the packaging metadata and tool configuration for Ultralytics YOLOv5.
# Most users run YOLOv5 directly from a repository clone with dependencies from requirements.txt.

# Pip install: setup.py stages the yolov5/ package tree at build time.
# Version is CalVer from the HEAD commit date (see setup.py).
# Dependencies: requirements.txt (single source of truth for dev and pip).

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov5"
dynamic = ["version", "dependencies"]
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
description = "Ultralytics YOLOv5 packaged for pip install"
readme = "README.md"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Tools settings -------------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
norecursedirs = [".git", "dist", "build"]

[tool.isort]
line_length = 120
multi_line_output = 0

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"benchmarks.py" = ["E402"]
"classify/*.py" = ["E402"]
"detect.py" = ["E402"]
"export.py" = ["E402"]
"models/tf.py" = ["E402"]
"models/yolo.py" = ["E402"]
"segment/*.py" = ["E402"]
"tests/test_flask_rest_api.py" = ["D101", "D102", "D103"]
"train.py" = ["E402"]
"utils/loggers/comet/__init__.py" = ["E402"]
"utils/loggers/comet/hpo.py" = ["E402"]
"val.py" = ["E402"]

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120
in-place = true
pre-summary-newline = true
close-quotes-on-newline = true

[tool.codespell]
ignore-words-list = "crate,nd,strack,dota,ane,segway,fo,gool,winn,commend"
skip = '*.csv,*venv*,docs/??/,docs/mkdocs_??.yml'
